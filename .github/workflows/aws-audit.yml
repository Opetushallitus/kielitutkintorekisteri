name: AWS audit

# Etsii AWS-tileiltä pinoja ja Lambda-ajonaikoja, jotka ovat karanneet
# CDK-appista. Kun pino poistetaan tai nimetään uudelleen koodissa,
# CloudFormation jättää vanhan pinon pystyyn eikä mikään enää päivitä sen
# resursseja — muun muassa Lambdojen ajonaikoja. Katso
# infra/scripts/audit-deployed-stacks.sh ja infra/README.md.
#
# Epäonnistuminen ilmoitetaan Slackiin slack-notifier.yml:n kautta.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: aws-audit
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  audit:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        environment: [Util, Dev, Test, Prod]
    permissions:
      id-token: write
      contents: read
      actions: read
    environment:
      name: ${{ matrix.environment }}
    env:
      TAG: ${{ github.sha }}
    steps:
      # Kesken oleva deploy näyttää auditille ajautumalta: päivittyvä pino on
      # UPDATE_IN_PROGRESS eikä lasketa deployatuksi (Test-Service 9.11.2026),
      # ja tili, jolle deployketju ei ole vielä ehtinyt, on auditoitavaa
      # committia jäljessä. Odotetaan siksi ennen AWS-kirjautumista, jotta
      # OIDC-tunnusten tunnin voimassaolo ei kulu odotukseen.
      - name: Wait for builds on main to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 90); do
            kesken="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
              --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "$kesken" = "0" ]; then
              exit 0
            fi
            echo "Mainin build- ja deployajoja kesken: $kesken. Odotetaan 30 s..."
            sleep 30
          done
          echo "::warning::Mainin deployt olivat yhä kesken 45 minuutin jälkeen. Auditoidaan silti."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to ${{ matrix.environment }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::${{ vars.account_id }}:role/kitu-github-actions-role
      - name: Install dependencies
        run: npm ci
        working-directory: infra
      - name: Audit deployed stacks and Lambda runtimes
        run: ./scripts/audit-deployed-stacks.sh
        working-directory: infra
