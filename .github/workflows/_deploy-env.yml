name: Deploy

on:
  workflow_call:
    inputs:
      stacks:
        type: string
        default: "**"
      environment:
        type: string
      action:
        type: string
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - Dev
          - Test
          - Prod
          - Util
        description: Target environment
      action:
        type: choice
        options:
          - deploy
          - diff
        description: Action to perform
      stacks:
        type: string
        description: Stacks to deploy
        default: "**"

concurrency:
  group: deploy-${{ github.ref_name }}-${{ inputs.environment }}
  # Cancel any in-progress jobs if a new one is queued, but only in Pull Requests.
  # On the main branch we don't want to cancel in-progress jobs, because they might be deploying.
  cancel-in-progress: ${{ inputs.action == 'diff' }}

env:
  TAG: ${{ github.sha }}
  MISE_ENV: ci

jobs:
  run:
    name: ${{ inputs.action }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.environment_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to ${{ inputs.environment }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::${{ vars.account_id }}:role/kitu-github-actions-role
      - name: Install dependencies
        run: npm ci
        working-directory: infra
      - name: Verify npm registry signatures
        run: npm audit signatures
        working-directory: infra
      - name: diff
        working-directory: infra
        if: inputs.action == 'diff'
        run: |
          npx cdk ${{ inputs.action }} --require-approval=never --exclusively '${{ inputs.environment }}/${{ inputs.stacks }}' --progress=events &> >(tee cdk.log)
          if [ -n "${{ github.event.number }}" ]; then
            cdk-notifier --log-file cdk.log --vcs github --repo kielitutkintorekisteri --owner ${{ github.repository_owner }} --pull-request-id ${{ github.event.number }} --template extendedWithResources --tag-id ${{ inputs.environment }} --suppress-hash-changes --suppress-hash-changes-regex '[+-].*?[a-fA-F0-9]{40}'
          else
            echo "::notice::Skipping cdk-notifier PR comment — no PR associated with this run (workflow_dispatch). Diff output is in the job log above."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: deploy
        working-directory: infra
        if: inputs.action == 'deploy'
        run: |
          aws logs start-live-tail --log-group-identifiers arn:aws:logs:eu-west-1:${{ vars.account_id }}:log-group:KituService &
          npx cdk ${{ inputs.action }} --require-approval=never --exclusively '${{ inputs.environment }}/${{ inputs.stacks }}'
