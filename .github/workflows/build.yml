name: Build

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

env:
  MISE_ENV: ci

# PR:n uusi push peruu edellisen ajon. Mainilla ja jonossa ryhmä on ajokohtainen,
# koska jaettu ryhmä korvaisi jonossa odottavan ajon ja ohittaisi sen deployn.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || format('build-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  determine_action:
    runs-on: ubuntu-24.04
    outputs:
      action: ${{ github.ref_name == 'main' && 'deploy' || 'diff' }}
    steps:
      - run: echo nothing to see here

  list_changes:
    name: List changes
    runs-on: ubuntu-24.04
    outputs:
      # Jonossa image ja infra pakotetaan päälle: jono on ainoa paikka, jossa
      # image rakennetaan ennen mergeä.
      mise: ${{ github.event_name == 'merge_group' || steps.filter.outputs.mise == 'true' }}
      infra: ${{ github.event_name == 'merge_group' || steps.filter.outputs.infra == 'true' }}
      image: ${{ github.event_name == 'merge_group' || steps.filter.outputs.image == 'true' }}
      server: ${{ steps.filter.outputs.server == 'true' }}
      e2e: ${{ steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Jonossa paths-filter vertaa merge_group.base_sha..head_sha, eli kaikkea
      # mitä jonon entry ja sitä edeltävät entryt tuovat mainin päälle.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            mise:
              - '.mise.toml'
              - '.mise.*.toml'
            infra:
              - 'infra/**'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            server: &server
              - 'server/**'
              - '.mise.toml'
              - '.mise.*.toml'
              - '.github/workflows/build.yml'
            e2e:
              - *server
              - 'e2e/**'
              - 'docker-compose.yml'

  # Merge queue fast-forwardaa mainin täsmälleen siihen committiin, jonka se
  # testasi, joten mainin push-ajo ohittaa testit jos jono on jo hyväksynyt
  # saman SHA:n. Suora push mainiin ei ole jonon varmistama ja ajaa kaiken.
  verified_in_queue:
    name: Verified in merge queue
    runs-on: ubuntu-24.04
    permissions:
      checks: read
    outputs:
      verified: ${{ steps.check.outputs.verified == 'true' }}
    steps:
      - id: check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: '["Server tests", "Frontend tests", "Check code formatting", "Infra lockfile in sync"]'
        run: |
          verified=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.app.slug == "github-actions" and (.conclusion == "success" or .conclusion == "skipped")) | .name' |
              jq -R -s --argjson required "$REQUIRED" '($required - split("\n")) == []'
          ) || verified=false
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          echo "::notice::Merge queue on jo varmistanut tämän SHA:n: $verified"

  update_tools_cache:
    name: Update tools cache if changed
    runs-on: ubuntu-24.04
    needs: list_changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        if: needs.list_changes.outputs.mise == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit_dependencies:
    name: Submit dependencies
    runs-on: ubuntu-24.04
    if: github.ref_name == 'main'
    permissions:
      contents: write
    needs: update_tools_cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub's dependency-graph API returns sporadic HTTP 500s. Retry up to 3
      # times with backoff, then degrade to a warning so a transient outage
      # doesn't fail the workflow run (and trigger a Slack false alarm).
      - name: Update dependency graph (attempt 1/3)
        id: submit1
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        continue-on-error: true
        with:
          directory: server
          ignore-maven-wrapper: "true"
      - name: Back off before retry
        if: steps.submit1.outcome == 'failure'
        run: sleep 30
      - name: Update dependency graph (attempt 2/3)
        id: submit2
        if: steps.submit1.outcome == 'failure'
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        continue-on-error: true
        with:
          directory: server
          ignore-maven-wrapper: "true"
      - name: Back off before final retry
        if: steps.submit2.outcome == 'failure'
        run: sleep 60
      - name: Update dependency graph (attempt 3/3)
        id: submit3
        if: steps.submit2.outcome == 'failure'
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        continue-on-error: true
        with:
          directory: server
          ignore-maven-wrapper: "true"
      - name: Warn if all attempts failed
        if: steps.submit3.outcome == 'failure'
        run: |
          echo "::warning::Dependency snapshot submission failed after 3 attempts — likely a transient GitHub API issue. Continuing without failing the build."

  server_tests:
    name: Server tests
    runs-on: ubuntu-24.04
    needs:
      - update_tools_cache
      - list_changes
      - verified_in_queue
    if: needs.list_changes.outputs.server == 'true' && needs.verified_in_queue.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('server/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build with Maven
        run: mvn -B package --file pom.xml
        working-directory: server

  frontend_tests:
    name: Frontend tests
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs:
      - update_tools_cache
      - list_changes
      - verified_in_queue
    if: needs.list_changes.outputs.e2e == 'true' && needs.verified_in_queue.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('server/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Start DB
        run: docker compose up -d db
        working-directory: server
      - name: Install dependencies
        run: npm ci
        working-directory: e2e
      - name: Verify npm registry signatures
        run: npm audit signatures
        working-directory: e2e
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: e2e
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  infra_lockfile:
    name: Infra lockfile in sync
    runs-on: ubuntu-24.04
    needs:
      - update_tools_cache
      - verified_in_queue
    if: needs.verified_in_queue.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify infra/package-lock.json is in sync with package.json
        run: npm ci
        working-directory: infra

  lint:
    name: Check code formatting
    runs-on: ubuntu-24.04
    needs:
      - update_tools_cache
      - verified_in_queue
    if: needs.verified_in_queue.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting
        run: ./scripts/check-formatting.sh
      - name: Check workflow security
        run: ./scripts/check-workflows.sh

  build_image:
    name: Build image
    runs-on: ubuntu-24.04
    # Ei odota testejä: image on SHA-tagattu, ja deploy_dev odottaa testit
    # ennen kuin sitä käytetään.
    needs:
      - list_changes
      - update_tools_cache
    # Always build on main (the deploy needs the image pushed to ECR).
    # On PRs, only run when Dockerfile/.dockerignore changed — the app code is
    # already verified by server_tests/frontend_tests, so a green check from
    # this job on every PR is mostly wasted CI time.
    if: github.ref_name == 'main' || needs.list_changes.outputs.image == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to utility account
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: github.ref_name == 'main'
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::961341524988:role/kitu-github-actions-role
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: login-ecr
        if: github.ref_name == 'main'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: ${{ github.ref_name == 'main' }}
          tags: ${{
            steps.login-ecr.outputs.registry
            && format('{0}/{1}', steps.login-ecr.outputs.registry, 'kitu')
            || 'kitu'
            }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_util:
    name: Util
    uses: ./.github/workflows/_deploy-env.yml
    needs:
      - list_changes
      - update_tools_cache
      - determine_action
    # Merge queue -haara on kertakäyttöinen eikä deployn OIDC-rooli luota
    # siihen, joten jonossa ajetaan vain varmistukset, ei diffiä.
    if: github.event_name != 'merge_group' && (needs.determine_action.outputs.action == 'deploy' || needs.list_changes.outputs.infra == 'true')
    with:
      environment: Util
      action: ${{ needs.determine_action.outputs.action }}

  deploy_dev:
    name: Dev
    needs:
      - build_image
      - determine_action
      - deploy_util
      - server_tests
      - frontend_tests
      - lint
      - infra_lockfile
    uses: ./.github/workflows/_deploy-env.yml
    # Testit voivat olla ohitettuja (jonon varmistama SHA tai polkusuodatin),
    # ja ohitettu riippuvuus ohittaisi muuten koko deploy-ketjun.
    if: ${{ !failure() && !cancelled() && needs.build_image.result == 'success' && needs.determine_action.outputs.action == 'deploy' }}
    with:
      environment: Dev
      action: ${{ needs.determine_action.outputs.action }}

  deploy_test:
    name: Test
    needs:
      - determine_action
      - deploy_dev
    uses: ./.github/workflows/_deploy-env.yml
    if: ${{ !cancelled() && needs.deploy_dev.result == 'success' && needs.determine_action.outputs.action == 'deploy' }}
    with:
      environment: Test
      action: ${{ needs.determine_action.outputs.action }}

  deploy_prod:
    name: Prod
    needs:
      - determine_action
      - deploy_test
    uses: ./.github/workflows/_deploy-env.yml
    if: ${{ !cancelled() && needs.deploy_test.result == 'success' && needs.determine_action.outputs.action == 'deploy' }}
    with:
      environment: Prod
      action: ${{ needs.determine_action.outputs.action }}

  build_docs:
    name: Build documentation page
    runs-on: ubuntu-24.04
    needs:
      - update_tools_cache
      - deploy_prod
    if: ${{ !cancelled() && needs.deploy_prod.result == 'success' }}
    permissions:
      id-token: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build component documentation
        # Skripti kirjoittaa repon juuren uml/-hakemistoon ja luo sen itse.
        run: docs/build-uml.sh untuva qa prod
      - name: Verify technical documentation pages exist
        # docs/technical/ on käsinkirjoitettu tekninen dokumentaatio,
        # jonka jekyll-vaihe rendaa automaattisesti. Tämä tarkistus pysäyttää
        # CI:n, mikäli kansio tai jokin odotetuista sivuista on poistettu
        # vahingossa.
        run: |
          test -d docs/technical
          for page in README.md arkkitehtuuri.md koodikonventiot.md integraatiot.md yllapito.md; do
            test -f "docs/technical/$page" || { echo "::error::docs/technical/$page puuttuu"; exit 1; }
          done
      - name: Build html files from markdown files
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./docs/output
      - name: Build database documentation
        run: |
          sudo chmod -R 777 docs/output
          CI=true docs/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/output
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
