<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="778" viewBox="0 0 1600 778">
  <title>Kotoutumiskoulutus – tehtäväpankki: tietovirrat</title>
  <defs>
    <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; }
    .tausta { fill: #ffffff; }
    .otsikko { font-size: 24px; font-weight: bold; }
    .alaotsikko { font-size: 13px; fill: #4b5563; }
    .kaista { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .kaistan-nimi { font-size: 12px; font-weight: bold; fill: #64748b; letter-spacing: 0.5px; }
    .laatikko rect { stroke-width: 1.5; }
    .nimi { font-size: 14px; font-weight: bold; }
    .lisatieto { font-size: 11px; fill: #4b5563; }
    .kitu rect { fill: #dbeafe; stroke: #1e40af; stroke-width: 3; }
    .kios rect { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2.5; }
    .oph rect { fill: #eff6ff; stroke: #60a5fa; }
    .ulkoinen rect { fill: #fff7ed; stroke: #ea580c; }
    .infra rect { fill: #f0fdf4; stroke: #16a34a; }
    .toimija rect { fill: #f3f4f6; stroke: #6b7280; }
    .ryhma { fill: #f5f9ff; stroke: #60a5fa; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .ryhman-nimi { font-size: 14px; font-weight: bold; fill: #1e3a8a; }
    .nuoli path { fill: none; stroke: #374151; stroke-width: 1.6; }
    .heti path { stroke: #0e7490; stroke-width: 2.2; }
    .ajastettu path { stroke: #a16207; stroke-width: 2.2; }
    .pull path { stroke-dasharray: 7 4; }
    .kayttaja path { stroke: #9ca3af; stroke-width: 1.4; }
    .nuolen-teksti rect { fill: #ffffff; fill-opacity: 0.92; }
    .nuolen-teksti text { font-size: 11.5px; }
    .ei-kaytossa { opacity: 0.5; }
    .selite { font-size: 11.5px; }
    </style>
    <marker id="karki-heti" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#0e7490"/>
    </marker>
    <marker id="karki-ajastettu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#a16207"/>
    </marker>
    <marker id="karki-push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#374151"/>
    </marker>
    <marker id="karki-pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#374151"/>
    </marker>
    <marker id="karki-kayttaja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect class="tausta" x="0" y="0" width="1600" height="778"/>
  <g id="otsikko">
    <text class="otsikko" x="24" y="34">Kotoutumiskoulutus – tehtäväpankki: tietovirrat</text>
    <text class="alaotsikko" x="24" y="54">Koealustan kysymyspankkien tuonti kituun · tilanne 7.10.2026</text>
  </g>
  <g id="selite">
    <g class="laatikko kitu">
      <rect x="660" y="14" width="22" height="14" rx="3"/>
    </g>
    <text class="selite" x="688" y="25">Kielitutkintorekisteri</text>
    <g class="laatikko ulkoinen">
      <rect x="842.825" y="14" width="22" height="14" rx="3"/>
    </g>
    <text class="selite" x="870.825" y="25">Ulkoinen palvelu</text>
    <g class="laatikko infra">
      <rect x="989.4250000000001" y="14" width="22" height="14" rx="3"/>
    </g>
    <text class="selite" x="1017.4250000000001" y="25">AWS-infra</text>
    <g class="laatikko toimija">
      <rect x="1093.7625" y="14" width="22" height="14" rx="7"/>
    </g>
    <text class="selite" x="1121.7625" y="25">Käyttäjä</text>
    <g class="nuoli heti">
      <path d="M 660,44 L 690,44" marker-end="url(#karki-heti)"/>
    </g>
    <text class="selite" x="696" y="48">push heti</text>
    <g class="nuoli ajastettu">
      <path d="M 768.3375,44 L 798.3375,44" marker-end="url(#karki-ajastettu)"/>
    </g>
    <text class="selite" x="804.3375" y="48">push ajastetusti</text>
    <g class="nuoli push">
      <path d="M 918.9375,44 L 948.9375,44" marker-end="url(#karki-push)"/>
    </g>
    <text class="selite" x="954.9375" y="48">push, ajoitus ei tiedossa</text>
    <g class="nuoli pull">
      <path d="M 1123.875,44 L 1153.875,44" marker-end="url(#karki-pull)"/>
    </g>
    <text class="selite" x="1159.875" y="48">haku (pull)</text>
    <g class="nuoli kayttaja">
      <path d="M 1244.2875,44 L 1274.2875,44" marker-end="url(#karki-kayttaja)"/>
    </g>
    <text class="selite" x="1280.2875" y="48">käyttäjän toiminto</text>
    <text class="selite" x="1406.9624999999999" y="48">nuoli = tiedon kulkusuunta</text>
  </g>
  <g id="kaista-toimijat">
    <rect class="kaista" x="20" y="70" width="230" height="560" rx="10"/>
    <text class="kaistan-nimi" x="34" y="90">KÄYTTÄJÄT</text>
  </g>
  <g id="kaista-kielitestialusta">
    <rect class="kaista" x="270" y="70" width="650" height="560" rx="10"/>
    <text class="kaistan-nimi" x="284" y="90">KIELITESTIALUSTA</text>
  </g>
  <g id="kaista-rekisteri">
    <rect class="kaista" x="940" y="70" width="640" height="560" rx="10"/>
    <text class="kaistan-nimi" x="954" y="90">REKISTERI</text>
  </g>
  <g id="virkailija" class="laatikko toimija">
    <rect x="50" y="420" width="170" height="56" rx="28"/>
    <text class="nimi" x="135" y="444.5" text-anchor="middle">OPH-virkailija</text>
    <text class="lisatieto" x="135" y="461.5" text-anchor="middle">virkailija-CAS</text>
  </g>
  <g id="koealusta" class="laatikko ulkoinen">
    <rect x="430" y="240" width="280" height="150" rx="8"/>
    <text class="nimi" x="570" y="304" text-anchor="middle">Koealusta</text>
    <text class="lisatieto" x="570" y="321" text-anchor="middle">Moodle · Mediamaisteri</text>
    <text class="lisatieto" x="570" y="336" text-anchor="middle">kysymyspankit (Moodle-XML)</text>
  </g>
  <g id="kitu" class="laatikko kitu">
    <rect x="1040" y="240" width="300" height="150" rx="8"/>
    <text class="nimi" x="1190" y="296.5" text-anchor="middle">Kielitutkintorekisteri</text>
    <text class="lisatieto" x="1190" y="313.5" text-anchor="middle">kitu</text>
    <text class="lisatieto" x="1190" y="328.5" text-anchor="middle">tehtäväpaketit, tehtävät</text>
    <text class="lisatieto" x="1190" y="343.5" text-anchor="middle">ja vastaukset tietokannassa</text>
  </g>
  <g id="s3" class="laatikko infra">
    <rect x="1080" y="480" width="220" height="70" rx="8"/>
    <text class="nimi" x="1190" y="504" text-anchor="middle">S3</text>
    <text class="lisatieto" x="1190" y="521" text-anchor="middle">XML-tiedostot,</text>
    <text class="lisatieto" x="1190" y="536" text-anchor="middle">mp3- ja png-tiedostot</text>
  </g>
  <g id="kitu-hakee-luettelon" class="nuoli pull">
    <path d="M 710,290 L 1040,290" marker-end="url(#karki-pull)"/>
    <g class="nuolen-teksti">
      <rect x="755" y="251" width="239" height="34" rx="3"/>
      <text x="875" y="265" text-anchor="middle">
        <tspan x="875" y="265">tehtäväpankkien luettelo</tspan>
        <tspan x="875" y="279">export_question_bank · wstoken · klo 2</tspan>
      </text>
    </g>
  </g>
  <g id="kitu-hakee-xml" class="nuoli pull">
    <path d="M 710,350 L 1040,350" marker-end="url(#karki-pull)"/>
    <g class="nuolen-teksti">
      <rect x="737" y="311" width="276" height="34" rx="3"/>
      <text x="875" y="325" text-anchor="middle">
        <tspan x="875" y="325">Moodle-XML</tspan>
        <tspan x="875" y="339">kitu hakee luettelon downloadurl-osoitteesta</tspan>
      </text>
    </g>
  </g>
  <g id="kitu-s3" class="nuoli ajastettu">
    <path d="M 1190,390 L 1190,480" marker-end="url(#karki-ajastettu)" marker-start="url(#karki-ajastettu)"/>
    <g class="nuolen-teksti">
      <rect x="1195" y="416" width="185" height="34" rx="3"/>
      <text x="1200" y="430" text-anchor="start">
        <tspan x="1200" y="430">XML ja mediatiedostot S3:een,</tspan>
        <tspan x="1200" y="444">luku tietokantaan · öisin</tspan>
      </text>
    </g>
  </g>
  <g id="kitu-virkailija" class="nuoli kayttaja">
    <path d="M 1080,390 L 1080,448 L 220,448" marker-end="url(#karki-kayttaja)"/>
    <g class="nuolen-teksti">
      <rect x="505" y="428" width="270" height="20" rx="3"/>
      <text x="640" y="442" text-anchor="middle">
        <tspan x="640" y="442">tehtäväpaketit ja tehtävät · virkailija-CAS</tspan>
      </text>
    </g>
  </g>
  <g id="virkailija-hakee-s3" class="nuoli pull">
    <path d="M 1190,550 L 1190,600 L 135,600 L 135,476" marker-end="url(#karki-pull)"/>
    <g class="nuolen-teksti">
      <rect x="426" y="580" width="469" height="20" rx="3"/>
      <text x="660" y="594" text-anchor="middle">
        <tspan x="660" y="594">tiedostojen lataus: kitu ohjaa selaimen esiallekirjoitettuun S3-osoitteeseen</tspan>
      </text>
    </g>
  </g>
  <g id="kaista-yhteiset">
    <rect class="kaista" x="20" y="650" width="1560" height="108" rx="10"/>
    <text class="kaistan-nimi" x="34" y="670">YHTEISET OPH-PALVELUT</text>
  </g>
  <g id="otuva" class="laatikko oph">
    <rect x="34.0" y="684" width="1532" height="60" rx="8"/>
    <text class="nimi" x="48.0" y="708">Otuva</text>
    <text class="lisatieto" x="48.0" y="730">virkailijoiden CAS-kirjautuminen</text>
  </g>
</svg>
