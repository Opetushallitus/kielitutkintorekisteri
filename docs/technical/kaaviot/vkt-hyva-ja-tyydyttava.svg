    <text class="nimi" x="135" y="312" text-anchor="middle">Tutkinnon</text>
    <text class="lisatieto" x="135" y="329" text-anchor="middle">vastaanottaja</text>
    <text class="lisatieto" x="135" y="344" text-anchor="middle">virkailija-CAS</text>
  </g>
  <g id="virkailija" class="laatikko toimija">
    <rect x="50" y="470" width="170" height="56" rx="28"/>
    <text class="nimi" x="135" y="494.5" text-anchor="middle">OPH-virkailija</text>
    <text class="lisatieto" x="135" y="511.5" text-anchor="middle">KIOS ja kitu · virkailija-CAS</text>
  </g>
  <g id="suomifi" class="laatikko ulkoinen">
