    <text class="kaistan-nimi" x="34" y="790">YHTEISET OPH-PALVELUT</text>
  </g>
  <g id="onr" class="laatikko oph">
    <rect x="34.0" y="804" width="500" height="76" rx="8"/>
    <text class="nimi" x="48.0" y="828">Oppijanumerorekisteri</text>
    <text class="lisatieto" x="48.0" y="850">KIOS: henkilön luonti hetusta tai syntymäajasta</text>
    <text class="lisatieto" x="48.0" y="866">kitu: master-OID (haku)</text>
  </g>
  <g id="koodisto" class="laatikko oph">
    <rect x="550.0" y="804" width="500" height="76" rx="8"/>
    <text class="nimi" x="564.0" y="828">Koodistopalvelu</text>
    <text class="lisatieto" x="564.0" y="850">kitu: koodistot validointiin</text>
    <text class="lisatieto" x="564.0" y="866">(KIOS käyttää omaa kuntalistaansa)</text>
  </g>
  <g id="otuva" class="laatikko oph">
    <rect x="1066.0" y="804" width="500" height="76" rx="8"/>
    <text class="nimi" x="1080.0" y="828">Otuva</text>
    <text class="lisatieto" x="1080.0" y="850">virkailijoiden CAS-kirjautuminen</text>
    <text class="lisatieto" x="1080.0" y="866">CAS-tiketti KIOS → kitu ja ONR</text>
  </g>
</svg>
