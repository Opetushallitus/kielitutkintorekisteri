    <g class="nuolen-teksti">
      <rect x="194" y="192" width="149" height="34" rx="3"/>
      <text x="268" y="206" text-anchor="middle">
        <tspan x="268" y="206">yhteydenottopyyntö,</tspan>
        <tspan x="268" y="220">ajanvarauksen täydennys</tspan>
      </text>
    </g>
  </g>
