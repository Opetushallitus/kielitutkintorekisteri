    <text class="lisatieto" x="1190" y="386" text-anchor="middle">kitu</text>
    <text class="lisatieto" x="1190" y="401" text-anchor="middle">vain tarkastelu</text>
  </g>
  <g id="koski" class="laatikko oph">
    <rect x="1040" y="140" width="200" height="60" rx="8"/>
    <text class="nimi" x="1140" y="174" text-anchor="middle">KOSKI</text>
  </g>
  <g id="oma-opintopolku" class="laatikko oph">
