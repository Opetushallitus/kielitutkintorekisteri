    <g class="nuolen-teksti">
      <rect x="758" y="308" width="233" height="48" rx="3"/>
      <text x="875" y="322" text-anchor="middle">
        <tspan x="875" y="322">valmis suoritus arvosanoineen,</tspan>
        <tspan x="875" y="336">vastaanottaja ja paikkakunta</tspan>
        <tspan x="875" y="350">PUT /api/vkt/kios · CAS · tunneittain</tspan>
      </text>
    </g>
  </g>
  <g id="kitu-virkailija" class="nuoli kayttaja">
    <path d="M 1190,440 L 1190,700 L 135,700 L 135,526" marker-end="url(#karki-kayttaja)"/>
    <g class="nuolen-teksti">
      <rect x="501" y="680" width="318" height="20" rx="3"/>
      <text x="660" y="694" text-anchor="middle">
        <tspan x="660" y="694">suoritusten tarkastelu (vain luku) · virkailija-CAS</tspan>
      </text>
