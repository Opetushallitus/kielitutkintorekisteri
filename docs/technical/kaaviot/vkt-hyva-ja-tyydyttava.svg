  </g>
  <g id="kios-paytrail" class="nuoli heti">
    <path d="M 590,300 L 590,156" marker-end="url(#karki-heti)" marker-start="url(#karki-heti)"/>
    <g class="nuolen-teksti">
      <rect x="567" y="218" width="46" height="20" rx="3"/>
      <text x="590" y="232" text-anchor="middle">
        <tspan x="590" y="232">maksut</tspan>
