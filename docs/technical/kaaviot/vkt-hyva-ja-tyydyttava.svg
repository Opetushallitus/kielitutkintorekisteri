    <text class="lisatieto" x="380" y="141.5" text-anchor="middle">cas-oppija · valinnainen</text>
  </g>
  <g id="paytrail" class="laatikko ulkoinen">
    <rect x="500" y="100" width="180" height="56" rx="8"/>
    <text class="nimi" x="590" y="124.5" text-anchor="middle">Paytrail</text>
    <text class="lisatieto" x="590" y="141.5" text-anchor="middle">verkkomaksut</text>
  </g>
  <g id="viestinvalitys" class="laatikko oph">
