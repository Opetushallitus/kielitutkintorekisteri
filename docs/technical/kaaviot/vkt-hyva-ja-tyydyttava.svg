        <tspan x="320" y="380">ajanvaraukset ja arvosanat</tspan>
      </text>
    </g>
  </g>
  <g id="virkailija-kios" class="nuoli kayttaja">
    <path d="M 220,490 L 450,390" marker-end="url(#karki-kayttaja)"/>
    <g class="nuolen-teksti">
      <rect x="250" y="432" width="161" height="34" rx="3"/>
      <text x="330" y="446" text-anchor="middle">
        <tspan x="330" y="446">tutkinnon vastaanottajien</tspan>
        <tspan x="330" y="460">listaus</tspan>
      </text>
    </g>
  </g>
  <g id="kios-s3" class="nuoli heti">
    <path d="M 570,390 L 570,560" marker-end="url(#karki-heti)" marker-start="url(#karki-heti)"/>
    <g class="nuolen-teksti">
      <rect x="575" y="448" width="179" height="48" rx="3"/>
      <text x="580" y="462" text-anchor="start">
        <tspan x="580" y="462">yhteydenottopyynnön liitteet</tspan>
        <tspan x="580" y="476">selain lataa suoraan</tspan>
        <tspan x="580" y="490">(esiallekirjoitettu URL)</tspan>
      </text>
    </g>
  </g>
  <g id="kios-kitu" class="nuoli ajastettu">
