<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="914" viewBox="0 0 1600 914">
  <title>VKT hyvä ja tyydyttävä taitotaso: tietovirrat</title>
  <defs>
    <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; }
    .tausta { fill: #ffffff; }
    .otsikko { font-size: 24px; font-weight: bold; }
    .alaotsikko { font-size: 13px; fill: #4b5563; }
    .kaista { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .kaistan-nimi { font-size: 12px; font-weight: bold; fill: #64748b; letter-spacing: 0.5px; }
    .laatikko rect { stroke-width: 1.5; }
    .nimi { font-size: 14px; font-weight: bold; }
    .lisatieto { font-size: 11px; fill: #4b5563; }
    .kitu rect { fill: #dbeafe; stroke: #1e40af; stroke-width: 3; }
    .kios rect { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2.5; }
    .oph rect { fill: #eff6ff; stroke: #60a5fa; }
    .ulkoinen rect { fill: #fff7ed; stroke: #ea580c; }
    .infra rect { fill: #f0fdf4; stroke: #16a34a; }
    .toimija rect { fill: #f3f4f6; stroke: #6b7280; }
    .ryhma { fill: #f5f9ff; stroke: #60a5fa; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .ryhman-nimi { font-size: 14px; font-weight: bold; fill: #1e3a8a; }
    .nuoli path { fill: none; stroke: #374151; stroke-width: 1.6; }
    .heti path { stroke: #0e7490; stroke-width: 2.2; }
    .ajastettu path { stroke: #a16207; stroke-width: 2.2; }
    .pull path { stroke-dasharray: 7 4; }
    .kayttaja path { stroke: #9ca3af; stroke-width: 1.4; }
    .nuolen-teksti rect { fill: #ffffff; fill-opacity: 0.92; }
    .nuolen-teksti text { font-size: 11.5px; }
    .ei-kaytossa { opacity: 0.5; }
    .selite { font-size: 11.5px; }
    </style>
    <marker id="karki-heti" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#0e7490"/>
    </marker>
    <marker id="karki-ajastettu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#a16207"/>
    </marker>
    <marker id="karki-push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#374151"/>
    </marker>
    <marker id="karki-pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#374151"/>
    </marker>
    <marker id="karki-kayttaja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect class="tausta" x="0" y="0" width="1600" height="914"/>
  <g id="otsikko">
    <text class="otsikko" x="24" y="34">VKT hyvä ja tyydyttävä taitotaso: tietovirrat</text>
    <text class="alaotsikko" x="24" y="54">Kielitutkintorekisterin (kitu) ja KIOS-ilmoittautumisjärjestelmän integraatiot · tilanne 7.10.2026</text>
  </g>
  <g id="selite">
    <g class="laatikko kitu">
      <rect x="660" y="14" width="22" height="14" rx="3"/>
    </g>
    <text class="selite" x="688" y="25">Kielitutkintorekisteri</text>
    <g class="laatikko kios">
      <rect x="842.825" y="14" width="22" height="14" rx="3"/>
    </g>
    <text class="selite" x="870.825" y="25">KIOS</text>
    <g class="laatikko oph">
      <rect x="916.975" y="14" width="22" height="14" rx="3"/>
    </g>
    <text class="selite" x="944.975" y="25">Muu OPH-palvelu</text>
    <g class="laatikko ulkoinen">
      <rect x="1057.5375" y="14" width="22" height="14" rx="3"/>
    </g>
    <text class="selite" x="1085.5375" y="25">Ulkoinen palvelu</text>
    <g class="laatikko toimija">
      <rect x="1204.1374999999998" y="14" width="22" height="14" rx="7"/>
    </g>
    <text class="selite" x="1232.1374999999998" y="25">Käyttäjä</text>
    <g class="laatikko infra">
      <rect x="1302.4374999999998" y="14" width="22" height="14" rx="3"/>
    </g>
    <text class="selite" x="1330.4374999999998" y="25">AWS-infra</text>
    <g class="nuoli heti">
      <path d="M 660,44 L 690,44" marker-end="url(#karki-heti)"/>
    </g>
    <text class="selite" x="696" y="48">push heti</text>
    <g class="nuoli ajastettu">
      <path d="M 768.3375,44 L 798.3375,44" marker-end="url(#karki-ajastettu)"/>
    </g>
    <text class="selite" x="804.3375" y="48">push ajastetusti</text>
    <g class="nuoli push">
      <path d="M 918.9375,44 L 948.9375,44" marker-end="url(#karki-push)"/>
    </g>
    <text class="selite" x="954.9375" y="48">push, ajoitus ei tiedossa</text>
    <g class="nuoli pull">
      <path d="M 1123.875,44 L 1153.875,44" marker-end="url(#karki-pull)"/>
    </g>
    <text class="selite" x="1159.875" y="48">haku (pull)</text>
    <g class="nuoli kayttaja">
      <path d="M 1244.2875,44 L 1274.2875,44" marker-end="url(#karki-kayttaja)"/>
    </g>
    <text class="selite" x="1280.2875" y="48">käyttäjän toiminto</text>
    <text class="selite" x="1406.9624999999999" y="48">nuoli = tiedon kulkusuunta</text>
  </g>
  <g id="kaista-toimijat">
    <rect class="kaista" x="20" y="70" width="230" height="680" rx="10"/>
    <text class="kaistan-nimi" x="34" y="90">KÄYTTÄJÄT</text>
