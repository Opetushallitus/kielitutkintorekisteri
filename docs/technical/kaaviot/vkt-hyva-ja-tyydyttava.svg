    <text class="kaistan-nimi" x="284" y="90">ILMOITTAUTUMINEN JA ARVIOINTI</text>
  </g>
  <g id="kaista-rekisteri">
    <rect class="kaista" x="940" y="70" width="640" height="680" rx="10"/>
    <text class="kaistan-nimi" x="954" y="90">REKISTERI JA JULKAISU</text>
  </g>
  <g id="kansalainen" class="laatikko toimija">
    <rect x="50" y="120" width="170" height="56" rx="28"/>
    <text class="nimi" x="135" y="144.5" text-anchor="middle">Kansalainen</text>
    <text class="lisatieto" x="135" y="161.5" text-anchor="middle">tutkinnon suorittaja</text>
  </g>
  <g id="vastaanottaja" class="laatikko toimija">
