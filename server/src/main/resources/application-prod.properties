kitu.env.name=prod
kitu.appUrl=https://virkailija.opintopolku.fi/kielitutkinnot
kitu.opintopolkuHostname=virkailija.opintopolku.fi
kitu.lokalisointi.namespace=kielitutkintorekisteri
kitu.lokalisointi.scheduling.enabled=true

spring.datasource.url=${DATABASE_URL}?stringtype=unspecified
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

kitu.kotoutumiskoulutus.koealusta.baseurl=https://kielitesti.opintopolku.fi
kitu.kotoutumiskoulutus.koealusta.scheduling.enabled=true
kitu.kotoutumiskoulutus.koealusta.scheduling.import.schedule=DAILY|01:00
kitu.kotoutumiskoulutus.koealusta.scheduling.importTehtavapankki.schedule=DAILY|02:00
kitu.kotoutumiskoulutus.tehtavapankki.bucket=kitu-bucket-prod

kitu.ilmoittautumispalvelu.service.url=https://yki.opintopolku.fi

kitu.oppijanumero.service.url=https://prod.oppijanumerorekisteri.opintopolku.fi/oppijanumerorekisteri-service
kitu.organisaatiopalvelu.service.url=https://organisaatio.prod.organisaatio.opintopolku.fi/organisaatio-service

kitu.yki.baseUrl=https://yki.jyu.fi/oph/
kitu.yki.convertLegacyArviointitila.enabled=true

kitu.vkt.scheduling.cleanup.retentionTime=7d

kitu.koski.baseUrl=https://opintopolku.fi/koski/api/
kitu.koski.scheduling.enabled=true
kitu.koski.scheduling.yki.schedule=DAILY|02:30
kitu.koski.scheduling.vkt.schedule=DAILY|01:00
kitu.koski.yki.transferBlockedUntil=2026-06-22T09:00:00

kitu.koodistopalvelu.baseUrl=https://koodisto.prod.koodisto.opintopolku.fi/koodisto-service/rest/

# Swagger UI ja /v3/api-docs ovat saatavilla local-, untuva- ja qa-ympäristöissä testausta varten,
# mutta tuotannossa pidetään ne pois käytöstä — kehitystyökalu, ei tarpeen julkisesti.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

otel.resource.providers.aws.enabled=true

# Tuotanto:
kitu.oids.valtionhallinnonkielitutkinnot=1.2.246.562.10.45203983650
kitu.oids.yleisetkielitutkinnot=1.2.246.562.10.00000000001
kitu.oids.palvelukayttaja=1.2.246.562.24.24817310943

# Validaatiot
kitu.validaatiot.yki.hetunSiirronRajapaiva=2026-01-01

#OAuth2 client
spring.security.oauth2.client.registration.kielitutkintorekisteri-client.provider=otuva
spring.security.oauth2.client.registration.kielitutkintorekisteri-client.client-id=koto-rekisteri
spring.security.oauth2.client.registration.kielitutkintorekisteri-client.client-secret=${PALVELUKAYTTAJA_OAUTH2_SECRET}
spring.security.oauth2.client.registration.kielitutkintorekisteri-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.kielitutkintorekisteri-client.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.otuva.authorization-uri=https://prod.otuva.opintopolku.fi/kayttooikeus-service/oauth2/authorize
spring.security.oauth2.client.provider.otuva.token-uri=https://prod.otuva.opintopolku.fi/kayttooikeus-service/oauth2/token
spring.security.oauth2.client.provider.otuva.jwk-set-uri=https://prod.otuva.opintopolku.fi/kayttooikeus-service/oauth2/jwks

#OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://prod.otuva.opintopolku.fi/kayttooikeus-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://prod.otuva.opintopolku.fi/kayttooikeus-service/oauth2/jwks

# Session cookie hardening. SameSite=lax (ei strict), jotta CAS-paluu opintopolku.fi:stä
# tuo session-evästeen mukanaan.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
