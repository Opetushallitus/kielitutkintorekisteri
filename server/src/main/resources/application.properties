spring.application.name=kitu
spring.main.banner-mode=off

server.servlet.context-path=/kielitutkinnot

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,application/json,text/csv
server.compression.min-response-size=1024

spring.session.jdbc.initialize-schema=never
spring.threads.virtual.enabled=true

spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=30s

management.health.defaults.enabled=false

server.error.whitelabel.enabled=false
server.error.path=/error

oph.oid=1.2.246.562.10.00000000001
kitu.env.name=
kitu.uses-ssl-proxy=true

kitu.kotoutumiskoulutus.koealusta.wstoken=${KIELITESTI_TOKEN}
kitu.kotoutumiskoulutus.koealusta.scheduling.enabled=false

kitu.palvelukayttaja.password=${PALVELUKAYTTAJA_PASSWORD}
kitu.palvelukayttaja.username=koto-rekisteri
kitu.palvelukayttaja.callerid=1.2.246.562.10.00000000001.koto-rekisteri


db-scheduler.enabled=true
db-scheduler.delay-startup-until-context-ready=true

db-scheduler-ui.history=true
db-scheduler-ui.log-limit=1000

kitu.yki.scheduling.retrySendingFailedArviointitilat.schedule=FIXED_DELAY|3600s
kitu.yki.arvioijarekisteri.integraatio.enabled=false
kitu.yki.scheduling.lahetaArvioijatSolkiin.schedule=FIXED_DELAY|900s
kitu.yki.scheduling.lahetaEpaonnistuneetArvioijatSolkiin.schedule=DAILY|02:15
# Poisto on peruuttamaton: karkausvuoden 29.2. eli kaytannossa ei koskaan, mutta tehtava
# nakyy db-scheduler-UI:ssa ja on ajettavissa kasin (schedule '-' piilottaisi sen kokonaan).
kitu.yki.scheduling.poistaVanhentuneetArvioijat.schedule=0 0 0 29 2 ?
kitu.yki.scheduling.paivitaArvioijaProjektiot.schedule=DAILY|03:15
# Ajetaan kasin db-scheduler-UI:sta kun kirjoituskytkin avataan ymparistossa.
kitu.yki.scheduling.synkronoiArvioijaKaudet.schedule=0 0 0 29 2 ?
kitu.yki.username=${YKI_API_USER}
kitu.yki.password=${YKI_API_PASSWORD}
kitu.yki.convertLegacyArviointitila.enabled=false
kitu.yki.arvioijarekisteri.muokkaus.enabled=false

kitu.vkt.scheduling.cleanup.schedule=FIXED_DELAY|3600s
kitu.vkt.scheduling.cleanup.retentionTime=5m

kitu.cas.scheduling.sessionMappingCleanup.schedule=DAILY|04:30

kitu.lokalisointi.namespace=
kitu.lokalisointi.scheduling.enabled=false
kitu.lokalisointi.scheduling.refresh.schedule=FIXED_DELAY|3600s

kitu.tolgee.baseUrl=https://app.tolgee.io
kitu.tolgee.apiKey=${TOLGEE_API_KEY:}
kitu.tolgee.sync.maxDeleteRatio=0.1
kitu.tolgee.sync.minDeleteAllowance=5
kitu.tolgee.sync.dryRun=false

logging.structured.format.console=ecs
logging.structured.format.file=ecs
otel.traces.exporter=otlp
otel.logs.exporter=none
# trace all requests, default is 10%
management.tracing.sampling.probability=1
# debug resource detection on AWS
logging.level.io.opentelemetry.contrib.aws.resource=TRACE

# Uncomment this to debug authentication/authorization issues.
# Ref: https://docs.spring.io/spring-security/reference/servlet/architecture.html#servlet-logging
#logging.level.org.springframework.security=TRACE

# Controller endpoint paths to include in the Swagger UI. APIs are defined per-domain, e.g. CSV
# export for YKI suoritukset is exposed at `GET /yki/api/suoritukset`. This patter matches any
# API endpoints with similar formats. Any endpoints matched by this pattern are shown in the UI
springdoc.pathsToMatch=/**/api/**/*
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.path=/api-docs

springdoc.swagger-ui.oauth.client-id=FillYourClientId
springdoc.swagger-ui.oauth.client-secret=FillYourClientSecret

# Untuva:
kitu.oids.valtionhallinnonkielitutkinnot=1.2.246.562.10.27736566558
kitu.oids.yleisetkielitutkinnot=1.2.246.562.10.00000000001
kitu.oids.palvelukayttaja=1.2.246.562.24.85478397072

kitu.validaatiot.yki.hetunSiirronRajapaiva=2026-01-01
kitu.validaatiot.yki.todistuskielenSiirronRajapaiva=2026-04-01
# Hetulistahaun sallitut kutsujat (henkilö-OIDeja pilkulla eroteltuna). Tyhja = reitti suljettu.
kitu.yki.hetulistahaku.sallitutKutsujat=
