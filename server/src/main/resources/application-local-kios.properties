# KIOS-debuggaus (github.com/Opetushallitus/kieli-ja-kaantajatutkinnot) lokaalisti. Käyttö:
#   SPRING_PROFILES_ACTIVE=local,local-kios KITU_DB_PORT=5433 ./scripts/start_tmux.sh -m online
# KITU_DB_PORT siirtää docker-composen tietokannan samaan porttiin kuin alla oleva datasource;
# ilman sitä kontti yrittää KKT:n varaamaa porttia 5432 eikä sovellus löydä tietokantaa.
# tmux: KITU_DB_PORT periytyy tietokantaikkunaan vain, jos tmux-palvelin ei ole jo käynnissä.

# Vaihdettu oletusportti 5433:een, koska kieli-ja-kaantajatutkinnot - lokaalitietokanta pyöritetään kanssa portissa 5432
spring.datasource.url=jdbc:postgresql://localhost:5433/kitu-dev?stringtype=unspecified

# github.com/Opetushallitus/kieli-ja-kaantajatutkinnot
kitu.ilmoittautumispalvelu.service.url=http://localhost:8083
