# Kitu ja paikallinen KIOS (yki-ilmoittautumispalvelu) samalla koneella.
# Profiilit: SPRING_PROFILES_ACTIVE=local,local-kios (ei local-opintopolku: KIOS hyv\u00E4ksyy vain dev-OTUVAn tokenit).
# Tietokanta: KITU_DB_PORT=5433 docker compose up db (KIOSin tietokanta varaa portin 5432).

# TODO: Decide which repo moves its database off 5432.
#   Saw: both bind host 5432 (kitu docker-compose.yml, KIOS docker-compose-yki.yml:38).
#   Did: kitu moves to 5433 here. Other: KIOS moves, via its own profile (postgresql.url, application.yaml:14).
#   Settled by: kitu maintainer review.
spring.datasource.url=jdbc:postgresql://localhost:5433/kitu-dev?stringtype=unspecified

# KIOSin oletusportti on 8083 (kieli-ja-kaantajatutkinnot: backend/yki/src/main/resources/application.yaml).
kitu.ilmoittautumispalvelu.service.url=http://localhost:8083
