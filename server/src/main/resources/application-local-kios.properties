# KIOS-debuggaus (github.com/Opetushallitus/kieli-ja-kaantajatutkinnot) lokaalisti. Käyttö:
#   tmux set-environment -g KITU_DB_PORT 5433
#   SPRING_PROFILES_ACTIVE=local,local-kios ./scripts/start_tmux.sh -m online
# KITU_DB_PORT siirtää docker-composen tietokannan samaan porttiin kuin alla oleva datasource;
# ilman sitä kontti yrittää KIOSin varaamaa porttia 5432 eikä sovellus löydä tietokantaa.
# tmux-ikkunat saavat ympäristön tmux-palvelimelta, eivät komentoriviltä. Siksi muuttuja asetetaan
# tmux-palvelimeen. Poisto lopuksi: tmux set-environment -gu KITU_DB_PORT

# Vaihdettu oletusportti 5433:een, koska KIOSin lokaalitietokanta pyöritetään kanssa portissa 5432
spring.datasource.url=jdbc:postgresql://localhost:5433/kitu-dev?stringtype=unspecified

# github.com/Opetushallitus/kieli-ja-kaantajatutkinnot
kitu.ilmoittautumispalvelu.service.url=http://localhost:8083

# KIOS varaa portit 8080–8083 (backendit), 3000 ja 4000–4004 (frontendit). Kitu siirretään 8090:aan;
# appUrl (CAS-palvelu-URL) ja yki.baseUrl kovakoodaavat local-profiilissa portin 8080, joten nekin ylikirjoitetaan.
server.port=8090
kitu.appUrl=http://localhost:8090/kielitutkinnot
kitu.yki.baseUrl=http://localhost:8090/kielitutkinnot/dev/yki/import/

# KIOS-testidata ei saa päätyä untuvan KOSKIin
kitu.koski.scheduling.enabled=false
