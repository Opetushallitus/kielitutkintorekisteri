# Atarun arvioijahakemuslomakkeen kartoitus ympäristöittäin (ArvioijahakemusLomake), tuodaan
# application.propertiesista (spring.config.import). Jokaisessa ympäristössä on oma lomake, joten
# kysymysten id:t ja vaihtoehtojen arvot ovat ympäristökohtaisia: ne saa lomakkeelta reitiltä
# GET /lomake-editori/api/forms/latest/{lomakkeenAvain}. Kielten ja tasojen avaimet ovat
# vaihtoehtojen arvoja; "perus- ja keskitaso" on yksi vaihtoehto, joka antaa tasot PT ja KT.
# Ympäristö, jolla ei ole kartoitusta, kaatuu tuonnin alussa (ArvioijahakemusLomake.puutteet).

---
spring.config.activate.on-profile: e2e | local-opintopolku
kitu.ataru.arvioijahakemus:
  lomakkeenAvain: yki-arvioijahakemus
  kielikysymys: yki-arvioija-kielet
  kielet:
    "0":
      kieli: FIN
      tasokysymys: yki-arvioija-tasot-fin
      tasot: { "0": [PT, KT], "1": [YT] }
    "1":
      kieli: SWE
      tasokysymys: yki-arvioija-tasot-swe
      tasot: { "0": [PT, KT], "1": [YT] }
    "2":
      kieli: ENG
      tasokysymys: yki-arvioija-tasot-eng
      tasot: { "0": [PT, KT], "1": [YT] }

