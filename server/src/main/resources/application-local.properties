spring.datasource.url=jdbc:postgresql://localhost:5432/kitu-dev?stringtype=unspecified
spring.datasource.username=kitu
spring.datasource.password=kitu

server.error.whitelabel.enabled=true
server.error.include-exception=true
server.error.include-stacktrace=always
server.error.path=

trace-ui=http://localhost:16686/trace/{traceId}
# Local Jaeger only accepts OTLP traces; disable metrics export to silence 404s.
# otel.metrics.exporter disables the OpenTelemetry SDK metrics exporter;
# management.otlp.metrics.export.enabled disables Spring Boot's Micrometer OTLP
# registry, which is auto-configured separately and posts to localhost:4318/v1/metrics by default.
otel.metrics.exporter=none
management.otlp.metrics.export.enabled=false

kitu.env.name=local
kitu.appUrl=http://localhost:8080/kielitutkinnot
kitu.opintopolkuHostname=virkailija.untuvaopintopolku.fi
kitu.uses-ssl-proxy=false

# Lahdetekstit luetaan luokkapolulta (lokalisointi/*.json), joka on repon versioitu totuus.
# Untuvan proxy on satoja avaimia jaljessa eika julkaise sv/en:aa, joten live-haku ohittaisi
# kielikohtaisesti tuoreemmat lahdetekstit. Paivita ne komennolla scripts/fetch_kaannokset.py.
kitu.lokalisointi.namespace=

kitu.kotoutumiskoulutus.koealusta.baseurl=https://kielitesti.mmg.fi
kitu.kotoutumiskoulutus.koealusta.scheduling.enabled=true
kitu.kotoutumiskoulutus.koealusta.scheduling.import.schedule=DAILY|00:00
kitu.kotoutumiskoulutus.koealusta.scheduling.importTehtavapankki.schedule=-

# Tehtäväpankin lataus paikalliseen LocalStackiin (docker-compose-palvelu)
kitu.kotoutumiskoulutus.tehtavapankki.bucket=kitu-bucket-local
spring.cloud.aws.s3.enabled=true
spring.cloud.aws.s3.endpoint=http://localhost:4566
spring.cloud.aws.s3.path-style-access-enabled=true
spring.cloud.aws.region.static=eu-west-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test

kitu.oppijanumero.service.url=https://dev.oppijanumerorekisteri.opintopolku.fi/oppijanumerorekisteri-service
kitu.organisaatiopalvelu.service.url=https://organisaatio.dev.organisaatio.opintopolku.fi/organisaatio-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev.otuva.opintopolku.fi/kayttooikeus-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev.otuva.opintopolku.fi/kayttooikeus-service/oauth2/jwks

kitu.yki.arvioijarekisteri.muokkaus.enabled=true
kitu.yki.arvioijarekisteri.integraatio.enabled=true
kitu.yki.scheduling.lahetaArvioijatSolkiin.schedule=-
kitu.yki.scheduling.lahetaEpaonnistuneetArvioijatSolkiin.schedule=-
kitu.yki.baseUrl=http://localhost:8080/kielitutkinnot/dev/yki/import/
#kitu.yki.baseUrl=https://yki-test.cc.jyu.fi/oph/

kitu.koski.baseUrl=https://untuvaopintopolku.fi/koski/api/
kitu.koski.scheduling.enabled=true
kitu.koski.scheduling.yki.schedule=DAILY|03:30
kitu.koski.scheduling.vkt.schedule=DAILY|03:30

kitu.koodistopalvelu.baseUrl=https://koodisto.dev.koodisto.opintopolku.fi/koodisto-service/rest/

