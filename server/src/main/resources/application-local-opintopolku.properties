spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/dev/oauth/token

kitu.env.name=localkoski
kitu.koski.username=p\u00E4\u00E4
kitu.koski.password=p\u00E4\u00E4
kitu.koski.baseUrl=http://localhost:7021/koski/api/

kitu.kotoutumiskoulutus.koealusta.scheduling.enabled=true
kitu.kotoutumiskoulutus.koealusta.scheduling.importTehtavapankki.schedule=DAILY|01:00

kitu.lokalisointi.namespace=

# --- Offline-kehityksen oletukset ---
# Korvaa ${ENV_VAR}-paikanvaraajat, jotka muutoin haetaan AWS Secrets Managerista
# scripts/ensure_aws_secrets.sh:n kautta. Profiilikohtainen tiedosto voittaa
# application.properties:n ja application-local.properties:n arvot.
kitu.kotoutumiskoulutus.koealusta.wstoken=offline-dummy
kitu.palvelukayttaja.password=offline-dummy
kitu.yki.arvioijarekisteri.muokkaus.enabled=true
kitu.yki.arvioijarekisteri.integraatio.enabled=false
kitu.yki.username=offline-dummy
kitu.yki.password=offline-dummy
spring.security.oauth2.client.registration.kielitutkintorekisteri-client.client-secret=offline-dummy

# Est\u00E4 ulkoisia palveluita kutsuvat ajastetut teht\u00E4v\u00E4t.
kitu.koski.scheduling.enabled=false
kitu.kotoutumiskoulutus.koealusta.scheduling.import.schedule=-

# Ohjaa OAuth2-clientin tarjoaja localhostiin, jotta beanin alustus ei pid\u00E4
# kiinni dev.otuva.opintopolku.fi:st\u00E4. Token-p\u00E4\u00E4tepiste on MockLoginControllerin
# tarjoama /dev/oauth/token; mockattujen palveluiden takia sit\u00E4 ei k\u00E4yt\u00E4nn\u00F6ss\u00E4
# kutsuta offline-tilassa.
spring.security.oauth2.client.provider.otuva.authorization-uri=http://localhost:8080/dev/oauth/authorize
spring.security.oauth2.client.provider.otuva.token-uri=http://localhost:8080/dev/oauth/token
spring.security.oauth2.client.provider.otuva.jwk-set-uri=http://localhost:8080/dev/oauth/jwks

# MockAtaruClient vastaa; osoite vain kytkee tuontipalvelun paalle.
kitu.ataru.service.url=http://localhost/mock-ataru
kitu.ataru.arvioijahakemus.schedule=0 0 0 29 2 ?
