spring.datasource.url=jdbc:postgresql://localhost:5432/kitu-test-e2e-${TEST_PARALLEL_INDEX}?stringtype=unspecified
spring.datasource.username=kitu
spring.datasource.password=kitu
# Tappaa CI:llä jumiutuneet kyselyt, jotta peräkkäisten testien beforeEach:n TRUNCATE
# ei jää roikkumaan edellisen, Playwrightin abortoiman kyselyn AccessShareLockin taakse.
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '20s'

spring.cloud.aws.s3.enabled=false

server.port=${TEST_WORKER_PORT}

kitu.env.name=e2e
kitu.appUrl=http://127.0.0.1:${TEST_WORKER_PORT}/kielitutkinnot
kitu.opintopolkuHostname=virkailija.untuvaopintopolku.fi
kitu.uses-ssl-proxy=false

kitu.kotoutumiskoulutus.koealusta.wstoken=
kitu.kotoutumiskoulutus.koealusta.baseurl=

kitu.palvelukayttaja.password=
kitu.oppijanumero.service.url=http://localhost:${TEST_WORKER_PORT}/dev/mock/oppijanumerorekisteri-service
kitu.organisaatiopalvelu.service.url=http://localhost:${TEST_WORKER_PORT}/dev/mock/organisaatio-service

kitu.yki.username=
kitu.yki.password=
kitu.yki.convertLegacyArviointitila.enabled=false
kitu.yki.arvioijarekisteri.muokkaus.enabled=true
kitu.yki.baseUrl=http://localhost:${TEST_WORKER_PORT}/kielitutkinnot/dev/yki/import/
kitu.yki.arvioijarekisteri.integraatio.enabled=true
# 29.2. eika '-': '-' piilottaisi tehtavan db-scheduler-UI:sta, jolloin sita ei voi laukaista testista.
kitu.yki.scheduling.lahetaArvioijatSolkiin.schedule=0 0 0 29 2 ?
kitu.yki.scheduling.lahetaEpaonnistuneetArvioijatSolkiin.schedule=0 0 0 29 2 ?
kitu.yki.scheduling.paivitaArvioijaProjektiot.schedule=0 0 0 29 2 ?
kitu.yki.scheduling.synkronoiArvioijaKaudet.schedule=0 0 0 29 2 ?

kitu.koski.baseUrl=
kitu.koski.scheduling.enabled=false
kitu.koski.scheduling.yki.schedule=
kitu.koski.scheduling.vkt.schedule=

kitu.koodistopalvelu.baseUrl=

# Ei valimuistia: db.withEmptyDatabase() tyhjentaa kannan mutta ei sovelluksen
# valimuistia, joten 60 s:n TTL antaisi "tyhjasta kannasta" -vaitteille edellisen
# testin luvut, jos jokin aiempi testi on avannut kojelaudan.
kitu.dashboard.cache.ttl=0s

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:${TEST_WORKER_PORT}/dev/oauth/token

# Untuva:
kitu.oids.valtionhallinnonkielitutkinnot=1.2.246.562.10.27736566558
kitu.oids.yleisetkielitutkinnot=1.2.246.562.10.00000000001
kitu.oids.palvelukayttaja=1.2.246.562.24.85478397072

# MockAtaruClient vastaa; osoite vain kytkee tuontipalvelun paalle.
kitu.ataru.service.url=http://localhost/mock-ataru
kitu.ataru.arvioijahakemus.schedule=0 0 0 29 2 ?
